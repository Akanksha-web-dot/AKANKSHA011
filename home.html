<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
            height: 100vh;

            /* ✅ FIXED BACKGROUND */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url('AU campuss.jpeg') no-repeat center center;
            background-size: cover;
        }

        .login-box {
            width: 350px;
            padding: 40px;
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            color: white;
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .login-box button:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Student Login</h2>

    <input type="email" id="email" placeholder="College Email ID">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {

    var username = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    // ✅ Email validation
    if(!username.endsWith("@stu.alliance.edu.in")){
        alert("Enter valid Alliance college email");
        return;
    }

    // ✅ Empty check
    if(username === "" || password === ""){
        alert("Please fill all fields");
        return;
    }

    // ✅ Save user (for dashboard)
    localStorage.setItem("loggedInUser", username);

    alert("Login Successful!");

    // ✅ REDIRECT TO DASHBOARD (IMPORTANT)
    window.location.href = "index.html";
}
</script>

</body>
</html>
