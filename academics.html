<!DOCTYPE html>
<html>
<head>
    <title>Academic Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }
        h1 {
            background: #2c3e50;
            color: white;
            padding: 15px;
        }
        .card {
            background: white;
            margin: 20px auto;
            padding: 15px;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        textarea {
            width: 80%;
            height: 80px;
        }
        canvas {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>ACADEMIC DASHBOARD</h1>

<div class="card">
    <h2>📅 Timetable</h2>
    <p>Mon: Math, Physics, CS</p>
    <p>Tue: English, Math, Lab</p>
    <p>Wed: Physics, CS, Sports</p>
</div>

<div class="card">
    <h2>📝 Exam Dates</h2>
    <p>Math - 10 May</p>
    <p>Physics - 12 May</p>
    <p>CS - 15 May</p>
</div>

<div class="card">
    <h2>📊 Student Performance (Graph)</h2>
    <canvas id="graphCanvas" width="400" height="300"></canvas>
</div>

<div class="card">
    <h2>📌 Attendance</h2>
    <p>Math: 90%</p>
    <p>Physics: 85%</p>
    <p>CS: 95%</p>
</div>

<div class="card">
    <h2>💬 Suggestion Box</h2>
    <textarea id="suggestion"></textarea><br>
    <button onclick="saveSuggestion()">Submit</button>
</div>

<script>
// Simple bar graph
let canvas = document.getElementById("graphCanvas");
let ctx = canvas.getContext("2d");

let subjects = ["Math", "Physics", "CS"];
let marks = [85, 78, 92];

let x = 50;
for (let i = 0; i < marks.length; i++) {
    let height = marks[i] * 2;

    ctx.fillStyle = "blue";
    ctx.fillRect(x, 300 - height, 50, height);

    ctx.fillStyle = "black";
    ctx.fillText(subjects[i], x, 290);

    x += 80;
}

// Suggestion box
function saveSuggestion() {
    let text = document.getElementById("suggestion").value;

    if(text === "") {
        alert("Please enter a suggestion!");
        return;
    }

    let suggestions = JSON.parse(localStorage.getItem("suggestions")) || [];
    suggestions.push(text);
    localStorage.setItem("suggestions", JSON.stringify(suggestions));

    alert("Suggestion submitted!");
    document.getElementById("suggestion").value = "";
}
</script>

</body>
</html>
